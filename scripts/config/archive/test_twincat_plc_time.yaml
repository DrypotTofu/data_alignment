base_dir: ./sessions
session_name: null
# 将 TwinCAT PLC 时间轴作为所有数据源的主时钟。
# 视频帧的时间戳会自动加上估计的 host->PLC 偏移，从而与位姿数据共享同一轴。
clock_source: twincat_master
clock_offset_ns: 0
sources:
  - type: twincat
    name: robot_pose
    topic_name: robot/pose
    ams_net_id: '169.254.226.99.1.1'
    ams_port: 851
    ip_address: '192.168.22.22'
    cycle_period_ms: 1.0
    selected_arm: 1
    # 使用 PLC 任务周期计数器作为时间戳来源。
    # timestamp_ns = CycleCount * CycleTime_ns（默认 1 ms）。
    timestamp_mode: twincat
    # 若 PLC 任务周期不是 1 kHz，可显式覆盖：
    # twincat_timestamp_cycles_per_ms: 1.0
    # 主机->PLC 偏移的 EMA 平滑系数（0 = 禁用更新，1 = 不平滑）。
    twincat_master_sync_alpha: 0.05
    # 启用 ADS 往返延迟校正，进一步减小 offset 估计抖动。
    use_rtt_correction: true
    # 在 metadata 中同时输出 timestamp_ns_pc 和 timestamp_ns_plc，
    # 方便事后对比两种时间轴。
    output_dual_timestamps: true
    # 并行 ADS 连接数。1 连接约 260 Hz，2 连接约 620 Hz，4 连接约 1.3 kHz。
    # 连接数越多，重复 CycleCount 越多；30 FPS 视频用 1 连接即可。
    num_connections: 1
    symbols:
      armframe_positions: 'Sir_RunRunShaw_Database.EndEffector_Coordinate_ArmFrame'
      orientations: 'Sir_RunRunShaw_Database.EndEffector_Orientation'
    symbol_shapes:
      armframe_positions: [4, 3]
      orientations: [4, 4]

  # 示例：在此配置下添加的相机源也会输出 PLC 轴上的时间戳。
  # - type: usb_camera
  #   name: wrist_camera
  #   camera_index: 0
  #   fps: 30
  #   width: 640
  #   height: 480
