base_dir: ./sessions
session_name: null
clock_source: host_realtime
clock_offset_ns: 0
sources:
  # arm_2: endoscope / LCC5046B (USB camera, 1280x720).
  # Runs in the session writer thread so PNG encoding does not block capture.
  - type: usb_camera
    name: camera_arm_2
    camera_index: 3
    topic_name: camera/arm_2/image_raw
    arm_id: 2
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    backend: dshow
    save_images: true
    image_format: png

  # arm_1: left wrist Endoskill (separate OS process, DirectShow, MJPG, 640x480).
  - type: process_camera
    name: camera_arm_1
    camera_index: 1
    topic_name: camera/arm_1/image_raw
    arm_id: 1
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    backend: dshow
    image_format: png

  # arm_3: right wrist Endoskill (separate OS process, DirectShow, YUY2, 640x480).
  # Different FOURCC avoids the identical-device DirectShow conflict.
  - type: process_camera
    name: camera_arm_3
    camera_index: 2
    topic_name: camera/arm_3/image_raw
    arm_id: 3
    width: 640
    height: 480
    fps: 30
    fourcc: YUY2
    backend: dshow
    image_format: png

  # arm_4: reserved slot, no physical camera connected yet.
  - type: reserved_arm
    name: camera_arm_4
    topic_name: camera/arm_4/image_raw
    arm_id: 4
