base_dir: ./sessions
session_name: null
clock_source: host_realtime
clock_offset_ns: 0
sources:
  - type: usb_camera
    name: camera_endoscope
    camera_index: 0
    topic_name: camera/endoscope/image_raw
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    backend: msmf
    save_images: true
    image_format: png
  - type: usb_camera
    name: camera_wrist_right
    camera_index: 3
    topic_name: camera/wrist_right/image_raw
    width: 640
    height: 480
    fps: 30
    fourcc: YUY2
    backend: dshow
    save_images: true
    image_format: png
