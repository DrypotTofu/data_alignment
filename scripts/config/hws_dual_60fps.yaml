# Dual HWS capture-card configuration verified with TwinCAT on 2026-11-17.
# arm_2 -> HDPro 1 (SDK index 0); arm_1 -> HDPro 2 (SDK index 1).
base_dir: ./sessions
session_name: null
clock_source: host_realtime
clock_offset_ns: 0
camera_bindings:
  arm_2: 0
  arm_1: 1
sources:
- type: twincat
  name: robot_pose
  topic_name: robot/pose
  ams_net_id: 169.254.226.99.1.1
  ams_port: 851
  ip_address: 192.168.22.22
  cycle_period_ms: 1.0
  selected_arm: 1
  timestamp_mode: twincat
  twincat_master_sync_alpha: 0.05
  use_rtt_correction: true
  output_dual_timestamps: true
  num_connections: 1
  output_all_arms: true
  symbols:
    joint_angles: Sir_RunRunShaw_Database.Joint_Angles
    armframe_positions: Sir_RunRunShaw_Database.EndEffector_Coordinate_ArmFrame
    scopeframe_positions: Sir_RunRunShaw_Database.EndEffector_Coordinate_ScopeFrame
    orientations: Sir_RunRunShaw_Database.EndEffector_Orientation
    instrument_types: Sir_RunRunShaw_Database.Instrument_Type
    gripper_angle: Sir_RunRunShaw_Database.Gripper_Angle
    gripper_signal: Sir_RunRunShaw_Database.Gripper_Signal
    energy_instrument_status: Sir_RunRunShaw_Database.EnergyInstrument_Status
  symbol_shapes:
    joint_angles: [4, 12]
    armframe_positions: [4, 3]
    scopeframe_positions: [4, 3]
    orientations: [4, 4]
    instrument_types: [4]
    gripper_angle: [4]
    gripper_signal: [4]
    energy_instrument_status: [4]
- type: hws_camera_process
  name: camera_arm_2
  topic_name: camera/arm_2/image_raw
  arm_id: 2
  width: 1280
  height: 720
  fps: 60
  target_fps: null
  buffer_count: 4
  image_format: png
  png_compression: 1
  writer_threads: 6
  ready_timeout: 20.0
- type: hws_camera_process
  name: camera_arm_1
  topic_name: camera/arm_1/image_raw
  arm_id: 1
  width: 1280
  height: 720
  fps: 60
  target_fps: null
  buffer_count: 4
  image_format: png
  png_compression: 1
  writer_threads: 6
  ready_timeout: 20.0
