# Example VLGP acquisition session configuration using the current framework.
# Camera indices below match the current rig (confirmed T3/T4, 2026-08-17/18):
# arm_1=1, arm_2=0, arm_3=3 — same as scripts/config/default.yaml. NOTE this
# file is the DEFAULT --config of run_acquisition.py, so it must stay in sync
# with the physical wiring.

base_dir: ./sessions
session_name: null  # null -> auto-generate from current UTC time
clock_source: host_realtime
clock_offset_ns: 0
camera_bindings:
  arm_1: 3
  arm_2: 0
  arm_3: 1

sources:
  # Endoscope / main view. `fps` selects the fast driver stream, while
  # `target_fps` is the exact output rate produced by the worker decimator.
  - type: process_camera
    name: camera_arm_2
    topic_name: camera/arm_2/image_raw
    arm_id: 2
    width: 1280
    height: 720
    fps: 60
    target_fps: 30
    fourcc: MJPG
    backend: dshow
    image_format: png
    png_compression: 1
    writer_threads: 2
    ready_timeout: 20.0

  # Left wrist camera.
  - type: process_camera
    name: camera_arm_1
    topic_name: camera/arm_1/image_raw
    arm_id: 1
    width: 640
    height: 480
    fps: 60
    target_fps: 30
    fourcc: MJPG
    backend: dshow
    image_format: png
    ready_timeout: 20.0

  # Right wrist camera.
  - type: process_camera
    name: camera_arm_3
    topic_name: camera/arm_3/image_raw
    arm_id: 3
    width: 640
    height: 480
    fps: 60
    target_fps: 30
    fourcc: MJPG
    backend: dshow
    image_format: png
    ready_timeout: 20.0

  # TwinCAT ADS source for all four robot arms. If `symbols` and
  # `symbol_shapes` are omitted, TwinCATConfig uses the full 8-symbol defaults.
  - type: twincat
    name: robot_pose
    topic_name: robot/pose
    ams_net_id: 169.254.226.99.1.1
    ams_port: 851
    ip_address: 192.168.22.22
    cycle_period_ms: 1.0
    selected_arm: 1
    timestamp_mode: twincat
    use_rtt_correction: true
    output_dual_timestamps: true
    output_all_arms: true
