<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>VLGP Web Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h2>会话</h2>
      <ul id="session-list"></ul>
    </aside>
    <main id="main">
      <header id="info">
        <span id="session-name">未选择会话</span>
        <span id="row-info"></span>
        <span id="status-label"></span>
      </header>
      <div id="align-status"></div>
      <div id="align-progress" hidden><div id="align-progress-fill"></div></div>
      <section id="views">
        <canvas id="cam-2" class="cam endoscope" width="640" height="360"></canvas>
        <canvas id="cam-1" class="cam wrist" width="320" height="240"></canvas>
        <canvas id="cam-3" class="cam wrist" width="320" height="240"></canvas>
      </section>
      <div id="curve-bar" hidden>
        <span class="curve-title">曲线：</span>
        <button class="curve-btn active" data-arm="all">全部</button>
        <button class="curve-btn" data-arm="1">arm1</button>
        <button class="curve-btn" data-arm="2">arm2</button>
        <button class="curve-btn" data-arm="3">arm3</button>
        <button class="curve-btn" data-arm="4">arm4</button>
      </div>
      <div id="preload-bar" hidden>
        <div class="preload-track"><div id="preload-fill"></div></div>
        <span id="preload-text"></span>
      </div>
      <canvas id="motion" width="960" height="120"></canvas>
      <section id="robot-panel">
        <div id="arm-tabs"></div>
        <div id="arm-status"></div>
      </section>
      <section id="transport">
        <div id="timeline">
          <canvas id="time-ruler" width="960" height="16"></canvas>
          <input type="range" id="slider" min="0" max="0" value="0">
        </div>
        <div class="buttons">
          <button id="btn-in" disabled title="设置 IN ( [ )">IN</button>
          <button id="btn-out" disabled title="设置 OUT ( ] )">OUT</button>
          <button id="btn-prev" class="tbtn" title="上一帧 ( ← )"></button>
          <button id="btn-play" class="tbtn play" title="播放 / 暂停 ( 空格 )"></button>
          <button id="btn-next" class="tbtn" title="下一帧 ( → )"></button>
          <select id="speed" title="播放速度">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
          <span id="time-info"></span>
          <span id="trim-info"></span>
          <select id="status" disabled>
            <option value="pending">pending</option>
            <option value="approved">approved</option>
            <option value="rejected">rejected</option>
          </select>
          <button id="btn-save" disabled>保存 (S)</button>
          <button id="btn-next-session" disabled>下一个 (N)</button>
        </div>
      </section>
      <section id="pipeline">
        <div class="pipe-head">
          <span class="pipe-title">流水线</span>
          <span id="pipe-status"></span>
          <button id="btn-pipe-log" class="pipe-log-btn" title="查看运行日志">日志</button>
        </div>
        <div class="pipe-buttons">
          <button id="btn-verify" disabled>验证对齐</button>
          <button id="btn-build" disabled>构建数据集</button>
          <button id="btn-video" disabled>导出视频</button>
          <button id="btn-meta" disabled>写入元数据</button>
        </div>
        <pre id="pipe-log" hidden></pre>
        <div id="meta-form" hidden>
          <div class="meta-grid">
            <label>任务指令 (EN, SRT-H 风格)
              <input id="meta-task-instruction" placeholder="grasp the needle">
            </label>
            <label>任务类型
              <select id="meta-task-type">
                <option>needle_touching</option>
                <option>needle_grasping</option>
                <option>autonomous_suturing</option>
                <option>endoscope_adjust</option>
                <option>calibration</option>
                <option selected>other</option>
              </select>
            </label>
            <label>操作员 <input id="meta-operator"></label>
            <label>器械/模型 id <input id="meta-organ-model"></label>
            <label>标定 id (T7) <input id="meta-calibration"></label>
            <label>备注 <input id="meta-notes"></label>
            <label>器械分配 <input id="meta-instruments" placeholder="arm_1=圆头抓取钳,arm_3=持针钳"></label>
          </div>
          <div class="meta-actions">
            <button id="meta-save">保存</button>
            <button id="meta-cancel">取消</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
